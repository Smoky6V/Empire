{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Error interno | Empire Tecnologies</title>
    <link rel="icon" type="image/x-icon" href="{% static 'img/buildings-fill.svg' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/inicio.css' %}">
    <style>
        /* Mismo lenguaje visual que 403.html y 404.html: el usuario nunca ve
           la pagina tecnica de Django con el detalle interno del error. */
        .emp-err {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
            background: linear-gradient(150deg, var(--empire-primary) 0%, #060c1c 100%);
            color: #ffffff;
            text-align: center;
        }

        .emp-err__card {
            max-width: 620px;
            padding: 2.75rem 2rem;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .emp-err__code {
            margin: 0;
            font-size: clamp(3.2rem, 12vw, 5.5rem);
            font-weight: 800;
            line-height: 1;
            color: #ff8b95;
        }

        .emp-err__title {
            margin: 0.6rem 0 0.8rem;
            font-size: clamp(1.25rem, 3vw, 1.7rem);
            font-weight: 600;
            color: #ffffff;
        }

        .emp-err__text {
            margin: 0 0 1.75rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.78);
        }

        .emp-err__brand {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            margin-bottom: 1.25rem;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            color: rgba(255, 255, 255, 0.85);
        }

        .emp-err__brand img { display: block; }
        .emp-err__brand strong { color: #ffffff; }
    </style>
</head>
<body>
    <main class="emp-err">
        <div class="emp-err__card">
            <span class="emp-err__brand">
                <img src="{% static 'img/buildings-fill.svg' %}" alt="Empire Tecnologies" width="30" height="30">
                Empire<strong>Tecnologies</strong>
            </span>
            <p class="emp-err__code">500</p>
            <h1 class="emp-err__title">Algo falló de nuestro lado</h1>
            <p class="emp-err__text">
                No es tu culpa: registramos el problema y lo estamos revisando.
                Intenta de nuevo en unos minutos; si sigue igual, escríbenos.
            </p>
            <div class="d-flex flex-wrap gap-2 justify-content-center">
                <a class="emp-btn emp-btn--accent" href="{% url 'index' %}">
                    <i class="fas fa-house"></i> Volver al inicio
                </a>
                <a class="emp-btn emp-btn--ghost" href="{% url 'proyectos:buscar' %}">
                    <i class="fas fa-box-open"></i> Rastrear mi proyecto
                </a>
            </div>
        </div>
    </main>
</body>
</html>
